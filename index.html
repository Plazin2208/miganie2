<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Система пробуждения: Полный комплекс</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #0d1117;
    color: #c9d1d9;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    margin: 0;
  }
  
  h1 { color: #58a6ff; margin-bottom: 5px; font-size: 22px; text-align: center; }
  p.subtitle { color: #8b949e; margin-top: 0; margin-bottom: 25px; font-size: 14px; text-align: center; }

  .container {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 950px;
    width: 100%;
  }

  .controls-panel {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 20px;
    flex: 1;
    min-width: 300px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* Панель настройки камеры (Холодный / Теплый) */
  .camera-settings {
    background: #21262d;
    border: 1px solid #444c56;
    padding: 10px 12px;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 5px;
  }
  .camera-settings label { font-size: 12px; font-weight: 600; color: #58a6ff; }
  .camera-settings select {
    background: #0d1117;
    color: #c9d1d9;
    border: 1px solid #30363d;
    padding: 8px;
    border-radius: 6px;
    outline: none;
    cursor: pointer;
  }

  /* Чекбокс тихого режима */
  .silent-box {
    background: #21262d;
    border: 1px solid #444c56;
    padding: 10px 12px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    cursor: pointer;
    margin-bottom: 5px;
  }
  .silent-box input { cursor: pointer; width: 16px; height: 16px; }

  button {
    background: #21262d;
    color: #c9d1d9;
    border: 1px solid #30363d;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    text-align: left;
    display: flex;
    justify-content: space-between;
  }

  button:hover { background: #30363d; }
  button.active { background: #1f6feb; color: #fff; font-weight: bold; }
  button.auto-btn { background: #238636; border-color: #2ea043; color: #fff; font-weight: bold; }
  button.stop-btn { background: #da3633; border-color: #f85149; color: #fff; text-align: center; justify-content: center; }

  .display-panel {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 20px;
    flex: 1;
    min-width: 280px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform 0.05s;
  }

  /* Тряска на ПК для имитации вибрации */
  .shake { animation: shakeAnim 0.1s infinite; }
  @keyframes shakeAnim {
    0% { transform: translate(2px, 2px); }
    50% { transform: translate(-2px, -2px); }
    100% { transform: translate(0, 0); }
  }

  .lamps-wrapper {
    display: flex;
    gap: 30px;
    margin: 20px 0;
  }

  .lamp-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 12px;
    color: #8b949e;
  }

  .lamp {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #000;
    border: 2px solid #30363d;
    margin-bottom: 8px;
    transition: background-color 0.05s, box-shadow 0.05s;
  }

  .info-card {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 12px;
    width: 100%;
    font-size: 13px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<h1>Система пробуждения: Итоговая сборка</h1>
<p class="subtitle">Смена света камеры + Оранж/Синий сигнал + Вибрация в такт + Звук + Silent Mode</p>

<div class="container">
  <div class="controls-panel">
    
    <!-- Переключатель температуры света камеры -->
    <div class="camera-settings">
      <label for="camColor">Цвет постоянной подсветки (Камера):</label>
      <select id="camColor" onchange="updateCameraLight()">
        <option value="cool">Холодный белый (6000K)</option>
        <option value="warm">Теплый белый (3000K)</option>
      </select>
    </div>

    <!-- Переключатель тихого режима -->
    <label class="silent-box">
      <input type="checkbox" id="silentModeToggle">
      <span><b>Silent Mode</b> (Без звука на 1-2 фазах, нарастание с 3 фазы)</span>
    </label>

    <button id="btn1" onclick="startMode(1)">1. Сигнал внимания (Оранж | 1.0 Гц | 3.5с)</button>
    <button id="btn2" onclick="startMode(2)">2. Долгая адаптация (Синий | 1.5 Гц | 8с)</button>
    <button id="btn3" onclick="startMode(3)">3. Активная фаза (Чередование | 2.5 Гц | 8с)</button>
    <button id="btn4" onclick="startMode(4)">4. Экстренный вызов (Строб | До стопа)</button>
    <button id="btn5" class="auto-btn" onclick="startAutoCycle()">▶ Полный нарастающий цикл</button>
    <button class="stop-btn" onclick="stopAll()">⏹ Экстренный стоп</button>
  </div>

  <div id="displayPanel" class="display-panel">
    <div class="lamps-wrapper">
      <div class="lamp-box">
        <div id="camLamp" class="lamp"></div>
        <span id="camLabel">Камера (Холодный)</span>
      </div>
      <div class="lamp-box">
        <div id="signalLamp" class="lamp"></div>
        <span>Сигнал</span>
      </div>
    </div>
    
    <div class="info-card">
      <div><strong>Фаза:</strong> <span id="status">Дежурный режим</span></div>
      <div><strong>Обратный отсчет:</strong> <span id="countdown">-</span></div>
      <div><strong>Параметры:</strong> <span id="details">Выкл</span></div>
      <div><strong>Отклик (Вибро/Звук):</strong> <span id="feedbackStatus">Отключено</span></div>
    </div>
  </div>
</div>

<script>
  let blinkTimer = null;
  let countdownTimer = null;
  let phaseTimeout = null;
  let audioCtx = null;

  const camLamp = document.getElementById('camLamp');
  const signalLamp = document.getElementById('signalLamp');
  const displayPanel = document.getElementById('displayPanel');
  const statusEl = document.getElementById('status');
  const countdownEl = document.getElementById('countdown');
  const detailsEl = document.getElementById('details');
  const feedbackStatusEl = document.getElementById('feedbackStatus');
  const silentToggle = document.getElementById('silentModeToggle');
  const camLabel = document.getElementById('camLabel');

  // Управление цветом камеры (Холодный / Теплый)
  function updateCameraLight() {
    const mode = document.getElementById('camColor').value;
    if (mode === 'warm') {
      camLamp.style.backgroundColor = 'rgb(255, 214, 170)';
      camLamp.style.boxShadow = '0 0 35px rgba(255, 214, 170, 0.8)';
      camLabel.textContent = 'Камера (Теплый)';
    } else {
      camLamp.style.backgroundColor = 'rgb(240, 245, 255)';
      camLamp.style.boxShadow = '0 0 35px rgba(240, 245, 255, 0.9)';
      camLabel.textContent = 'Камера (Холодный)';
    }
  }

  // Генерация звука
  function playBeep(volume = 0.1, frequency = 600) {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    try {
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      
      osc.type = 'sawtooth';
      osc.frequency.value = frequency;
      
      gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
      
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    } catch(e) {}
  }

  // Вибрация (телефон + ПК тряска)
  function triggerVibration(duration, heavy = false) {
    if ("vibrate" in navigator) {
      navigator.vibrate(duration);
    }
    if (heavy) {
      displayPanel.classList.add('shake');
      setTimeout(() => displayPanel.classList.remove('shake'), duration);
    }
  }

  // Цвет сигнала
  function setSignalColor(colorType, brightness) {
    if (colorType === 'off' || brightness === 0) {
      signalLamp.style.backgroundColor = '#000';
      signalLamp.style.boxShadow = 'none';
      return;
    }
    if (colorType === 'orange') {
      const r = Math.floor(255 * brightness);
      const g = Math.floor(140 * brightness);
      signalLamp.style.backgroundColor = `rgb(${r}, ${g}, 0)`;
      signalLamp.style.boxShadow = `0 0 ${brightness * 35}px rgba(255, 140, 0, ${brightness})`;
    } else if (colorType === 'blue') {
      const b = Math.floor(255 * brightness);
      const g = Math.floor(100 * brightness);
      signalLamp.style.backgroundColor = `rgb(0, ${g}, ${b})`;
      signalLamp.style.boxShadow = `0 0 ${brightness * 35}px rgba(0, 100, 255, ${brightness})`;
    }
  }

  function clearAllTimers() {
    clearInterval(blinkTimer);
    clearTimeout(phaseTimeout);
    clearInterval(countdownTimer);
    displayPanel.classList.remove('shake');
  }

  function stopAll() {
    clearAllTimers();
    setSignalColor('off', 0);
    statusEl.textContent = 'Дежурный режим';
    countdownEl.textContent = '-';
    detailsEl.textContent = 'Выкл';
    feedbackStatusEl.textContent = 'Отключено';
    document.querySelectorAll('.controls-panel button').forEach(b => b.classList.remove('active'));
  }

  // Логика фаз
  function runPhase(modeNum, onComplete) {
    clearAllTimers();
    
    let durationSec = 0;
    let statusText = '';
    const isSilent = silentToggle.checked;

    if (modeNum === 1) {
      durationSec = 3.5;
      statusText = '1. Сигнал внимания';
      detailsEl.textContent = 'Оранжевый (80%) | 1.0 Гц (Без звука)';
      
      let state = false;
      blinkTimer = setInterval(() => {
        state = !state;
        if (state) {
          setSignalColor('orange', 0.8);
          triggerVibration(200, false);
          feedbackStatusEl.textContent = 'Вибрация такт (Слабая)';
        } else {
          setSignalColor('off', 0);
          feedbackStatusEl.textContent = 'Пауза';
        }
      }, 500);
    }
    else if (modeNum === 2) {
      durationSec = 8;
      statusText = '2. Долгая адаптация';
      detailsEl.textContent = 'Синий (100%) | 1.5 Гц' + (isSilent ? ' (Silent Mode)' : '');
      
      let state = false;
      blinkTimer = setInterval(() => {
        state = !state;
        if (state) {
          setSignalColor('blue', 1.0);
          triggerVibration(200, false);
          
          if (!isSilent) {
            playBeep(0.05, 500);
            feedbackStatusEl.textContent = 'Вибрация + Тихий звук';
          } else {
            feedbackStatusEl.textContent = 'Вибрация (Silent Mode)';
          }
        } else {
          setSignalColor('off', 0);
          feedbackStatusEl.textContent = 'Пауза';
        }
      }, 333);
    }
    else if (modeNum === 3) {
      durationSec = 8;
      statusText = '3. Активная фаза (Нарастание)';
      detailsEl.textContent = 'Оранж/Синий (100%) | 2.5 Гц';
      
      let state = false;
      let soundCounter = 0;
      blinkTimer = setInterval(() => {
        state = !state;
        soundCounter++;
        
        if (state) {
          setSignalColor('orange', 1.0);
          triggerVibration(150, true);
        } else {
          setSignalColor('blue', 1.0);
          triggerVibration(150, true);
        }

        // Нарастание звука с 3 фазы
        let volume = isSilent ? 0.02 + (soundCounter * 0.004) : 0.2;
        if (volume > 0.2) volume = 0.2;
        
        playBeep(isSilent ? Math.min(volume, 0.08) : 0.2, 800);
        feedbackStatusEl.textContent = `Сильная вибро + Нарастающий звук`;
      }, 200);
    }
    else if (modeNum === 4) {
      statusText = '4. Экстренный вызов';
      detailsEl.textContent = 'Строб (Оранж x2 / Синий x2)';
      
      let step = 0;
      blinkTimer = setInterval(() => {
        if (step === 0 || step === 2) {
          setSignalColor('orange', 1.0);
          triggerVibration(80, true);
        } else if (step === 4 || step === 6) {
          setSignalColor('blue', 1.0);
          triggerVibration(80, true);
        } else {
          setSignalColor('off', 0);
        }
        
        playBeep(0.3, 1000);
        feedbackStatusEl.textContent = 'Макс. вибро + МАКС. звук';
        step = (step + 1) % 8;
      }, 100);
      return;
    }

    statusEl.textContent = statusText;
    let timeLeft = durationSec;
    countdownEl.textContent = timeLeft.toFixed(1) + ' сек';
    
    countdownTimer = setInterval(() => {
      timeLeft -= 0.1;
      if (timeLeft <= 0) {
        clearInterval(countdownTimer);
        countdownEl.textContent = '0.0 сек';
      } else {
        countdownEl.textContent = timeLeft.toFixed(1) + ' сек';
      }
    }, 100);

    phaseTimeout = setTimeout(() => {
      if (onComplete) onComplete();
    }, durationSec * 1000);
  }

  function startMode(modeNum) {
    stopAll();
    document.getElementById('btn' + modeNum).classList.add('active');
    runPhase(modeNum, null);
  }

  function startAutoCycle() {
    stopAll();
    document.getElementById('btn5').classList.add('active');
    
    runPhase(1, () => {
      document.getElementById('btn1').classList.remove('active');
      document.getElementById('btn2').classList.add('active');
      runPhase(2, () => {
        document.getElementById('btn2').classList.remove('active');
        document.getElementById('btn3').classList.add('active');
        runPhase(3, () => {
          document.getElementById('btn3').classList.remove('active');
          document.getElementById('btn4').classList.add('active');
          runPhase(4, null);
        });
      });
    });
  }

  // Запуск при открытии страницы
  updateCameraLight();
</script>

</body>
</html>
